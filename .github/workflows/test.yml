name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  mtimes:
    name: Source timestamps retain nanosecond precision
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test timestamp storage and restoration
        run: /usr/bin/python3 -B -m unittest discover -s tests -v
